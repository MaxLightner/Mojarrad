name: WordPress Real Install / ACL Integration
on:
  push:
    branches: [wordpress]
    paths:
      - '.github/workflows/wordpress-smoke.yml'
      - 'wordpress/plugins/**'
      - 'wordpress/themes/mojarrad/*.php'
      - 'wordpress/themes/mojarrad/style.css'
      - 'wordpress/themes/mojarrad/assets/js/**'
      - 'wordpress/tools/mobile/**'
      - 'wordpress/playground/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local_only_test
          MYSQL_DATABASE: mojarrad_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal_only_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,mbstring,gd,zip,curl
          coverage: none
      - name: Install isolated WordPress and WP-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o wp-cli.phar
          php wp-cli.phar --info
          php wp-cli.phar core download --path=/tmp/mojarrad-test --quiet
          php wp-cli.phar config create --path=/tmp/mojarrad-test --dbname=mojarrad_test --dbuser=root --dbpass=local_only_test --dbhost=127.0.0.1:3306 --skip-check --quiet
          php wp-cli.phar core install --path=/tmp/mojarrad-test --url=http://127.0.0.1 --title='Mojarrad Test' --admin_user=siteadmin --admin_password='temporary-local-ci-only' --admin_email=test@example.org --skip-email --quiet
      - name: Install and activate theme and plugin
        run: |
          mkdir -p /tmp/mojarrad-test/wp-content/plugins/mojarrad-core
          cp -R wordpress/plugins/mojarrad-core/. /tmp/mojarrad-test/wp-content/plugins/mojarrad-core/
          mkdir -p /tmp/mojarrad-test/wp-content/themes/mojarrad
          cp -R wordpress/themes/mojarrad/. /tmp/mojarrad-test/wp-content/themes/mojarrad/
          php wp-cli.phar plugin activate mojarrad-core --path=/tmp/mojarrad-test
          php wp-cli.phar theme activate mojarrad --path=/tmp/mojarrad-test
      - name: Create demo fixture and run real WordPress permission tests
        run: |
          php wp-cli.phar eval --path=/tmp/mojarrad-test '
            $admins = get_users(array("role"=>"administrator","number"=>1));
            if (!$admins) throw new RuntimeException("Admin missing");
            wp_set_current_user((int)$admins[0]->ID);
            define("MOJARRAD_PLAYGROUND_SEED",true);
            require WP_PLUGIN_DIR . "/mojarrad-core/demo/demo-seed.php";
            require WP_PLUGIN_DIR . "/mojarrad-core/demo/smoke.php";
            if(get_option("mojarrad_playground_smoke")!=="passed") throw new RuntimeException("Smoke suite failed");
            echo "Mojarrad WordPress MySQL integration and ACL tests PASSED\n";
          '
      - name: Validate critical pages and plugin are registered
        run: |
          php wp-cli.phar eval --path=/tmp/mojarrad-test '
            foreach(array("dashboard","login","sale","blog","collaborate","consulting") as $slug){
              $p=get_page_by_path($slug);
              if(!$p) throw new RuntimeException("Missing page ".$slug);
            }
            if(!get_role("moj_owner")) throw new RuntimeException("Role not installed");
            if(!post_type_exists("moj_project")) throw new RuntimeException("CPT absent");
            echo "Template routes and activation verified\n";
          '


      - name: Serve site and test public routes, authentication and contact POST over HTTP
        shell: bash
        run: |
          set -euo pipefail
          php wp-cli.phar option update home http://127.0.0.1:8081 --path=/tmp/mojarrad-test --quiet
          php wp-cli.phar option update siteurl http://127.0.0.1:8081 --path=/tmp/mojarrad-test --quiet
          cat > /tmp/mojarrad-test/router.php <<'PHP'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          if (is_file(__DIR__ . $path)) return false;
          require __DIR__ . '/index.php';
          PHP
          php -S 127.0.0.1:8081 -t /tmp/mojarrad-test /tmp/mojarrad-test/router.php > /tmp/mojarrad-server.log 2>&1 &
          SERVER_PID=$!
          trap 'tail -n 80 /tmp/mojarrad-server.log || true; kill $SERVER_PID || true' EXIT
          sleep 3
          for path in / /projects/ /news/ /officials/ /about/ /consulting/ /collaborate/ /sale/ /blog/ /login/; do
            echo "Checking $path"
            if ! curl -fsS "http://127.0.0.1:8081$path" >/tmp/mojarrad-page.html; then
              cat /tmp/mojarrad-server.log; exit 1
            fi
            if ! grep -q 'class="site-brand"' /tmp/mojarrad-page.html || ! grep -q 'نیکابنا' /tmp/mojarrad-page.html; then
              echo "Nika Bana header missing: $path"; exit 1
            fi
          done
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/dashboard/)
          test "$CODE" = "302" || (echo "Anonymous dashboard HTTP status: $CODE"; exit 1)
          ANON=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/wp-json/mojarrad/v1/me/projects)
          test "$ANON" = "401" || (echo "Anonymous API status: $ANON"; exit 1)
          php wp-cli.phar user update moj_demo_owner --user_pass='ci-owner-password-only' --path=/tmp/mojarrad-test --quiet
          php wp-cli.phar user update moj_demo_contractor --user_pass='ci-contractor-password-only' --path=/tmp/mojarrad-test --quiet
          curl -fsS -c /tmp/moj-owner-cookie http://127.0.0.1:8081/wp-login.php > /dev/null
          curl -sS -L -b /tmp/moj-owner-cookie -c /tmp/moj-owner-cookie \
            --data-urlencode 'log=moj_demo_owner' \
            --data-urlencode 'pwd=ci-owner-password-only' \
            --data-urlencode 'wp-submit=Log In' \
            --data-urlencode 'testcookie=1' \
            http://127.0.0.1:8081/wp-login.php > /tmp/owner-login.html
          curl -fsS -b /tmp/moj-owner-cookie http://127.0.0.1:8081/dashboard/ > /tmp/owner-dashboard.html
          grep -q 'ویلای مسکونی طرقبه انجیری' /tmp/owner-dashboard.html
          if grep -q 'ویلای دوبلکس دهم شریع' /tmp/owner-dashboard.html; then
            echo "Data leak: owner saw contractor project"; exit 1
          fi
          # A review link is private navigation. Only a specifically assigned editor can approve.
          ARTICLE_ID=$(php wp-cli.phar eval --path=/tmp/mojarrad-test '
            $p=get_page_by_path("sakhtan-ya-sabr",OBJECT,"post");echo (int)$p->ID;
          ')
          test "$ARTICLE_ID" -gt 0
          ANON_REVIEW=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081/editorial/?article=$ARTICLE_ID")
          test "$ANON_REVIEW" = "302" || (echo "Anonymous reviewer page status: $ANON_REVIEW"; exit 1)
          OWNER_REVIEW=$(curl -sS -o /tmp/moj-owner-review.html -w '%{http_code}' -b /tmp/moj-owner-cookie "http://127.0.0.1:8081/editorial/?article=$ARTICLE_ID")
          test "$OWNER_REVIEW" = "403" || (echo "Ordinary member review status: $OWNER_REVIEW"; exit 1)
          if grep -q 'ساختن یا صبر کردن؟' /tmp/moj-owner-review.html; then echo "Draft leaked to regular member";exit 1; fi

          php wp-cli.phar user create moj_editorial_reviewer review@example.org --role=moj_engineer --user_pass='ci-reviewer-only' --path=/tmp/mojarrad-test --quiet
          php wp-cli.phar eval --path=/tmp/mojarrad-test '
            $u=get_user_by("login","moj_editorial_reviewer");$u->add_cap("moj_approve_editorial");
          '
          curl -fsS -c /tmp/moj-review-cookie http://127.0.0.1:8081/wp-login.php > /dev/null
          curl -sS -L -b /tmp/moj-review-cookie -c /tmp/moj-review-cookie \
            --data-urlencode 'log=moj_editorial_reviewer' \
            --data-urlencode 'pwd=ci-reviewer-only' \
            --data-urlencode 'wp-submit=Log In' \
            --data-urlencode 'testcookie=1' \
            --data-urlencode "redirect_to=http://127.0.0.1:8081/editorial/?article=$ARTICLE_ID" \
            http://127.0.0.1:8081/wp-login.php > /tmp/moj-editorial-review.html
          grep -q 'تأیید و زمان‌بندی انتشار' /tmp/moj-editorial-review.html
          grep -q 'ساختن یا صبر کردن؟' /tmp/moj-editorial-review.html
          REVIEW_NONCE=$(grep -o 'name="moj_editorial_nonce" value="[^"]*"' /tmp/moj-editorial-review.html | head -1 | sed -E 's/^.*value="([^"]*)"/\1/')
          test -n "$REVIEW_NONCE"
          REVIEW_HASH=$(grep -o 'name="review_hash" value="[^"]*"' /tmp/moj-editorial-review.html | head -1 | sed -E 's/^.*value="([^"]*)"/\\1/')
          test -n "$REVIEW_HASH"

          REVIEW_FORBIDDEN=$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/moj-owner-cookie \
            --data-urlencode 'action=moj_editorial_decision' \
            --data-urlencode "article=$ARTICLE_ID" --data-urlencode "moj_editorial_nonce=$REVIEW_NONCE" --data-urlencode "review_hash=$REVIEW_HASH" \
            --data-urlencode 'decision=publish' http://127.0.0.1:8081/wp-admin/admin-post.php)
          test "$REVIEW_FORBIDDEN" = "403"
          SCHEDULE_AT=$(date -u -d '+2 days' '+%Y-%m-%dT10:00')
          REVIEW_SCHEDULE=$(curl -sS -D /tmp/moj-schedule-headers -o /dev/null -w '%{http_code}' -b /tmp/moj-review-cookie \
            --data-urlencode 'action=moj_editorial_decision' \
            --data-urlencode "article=$ARTICLE_ID" --data-urlencode "moj_editorial_nonce=$REVIEW_NONCE" --data-urlencode "review_hash=$REVIEW_HASH" \
            --data-urlencode 'decision=schedule' --data-urlencode "publish_at=$SCHEDULE_AT" \
            http://127.0.0.1:8081/wp-admin/admin-post.php)
          test "$REVIEW_SCHEDULE" = "303" || (echo "Schedule status: $REVIEW_SCHEDULE"; exit 1)
          grep -i '^Location:' /tmp/moj-schedule-headers || true
          php wp-cli.phar eval --path=/tmp/mojarrad-test '
            $p=get_page_by_path("sakhtan-ya-sabr",OBJECT,"post");
            echo "DEBUG editorial status=".($p?$p->post_status:"missing")." approved=".($p?get_post_meta($p->ID,"_moj_editorial_approved_hash",true):"")." needsReview=".($p?get_post_meta($p->ID,"_moj_editorial_review_required",true):"")."\\n";
            if(!$p || $p->post_status!=="future" || !get_post_meta($p->ID,"_moj_editorial_approved_hash",true)) throw new RuntimeException("Article did not schedule.");
          '
          FUTURE_PUBLIC=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081/wp-json/wp/v2/posts/$ARTICLE_ID")
          test "$FUTURE_PUBLIC" = "404" || (echo "Scheduled draft public REST status: $FUTURE_PUBLIC"; exit 1)

          REVIEW_PUBLISH=$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/moj-review-cookie \
            --data-urlencode 'action=moj_editorial_decision' \
            --data-urlencode "article=$ARTICLE_ID" --data-urlencode "moj_editorial_nonce=$REVIEW_NONCE" --data-urlencode "review_hash=$REVIEW_HASH" \
            --data-urlencode 'decision=publish' http://127.0.0.1:8081/wp-admin/admin-post.php)
          test "$REVIEW_PUBLISH" = "303" || (echo "Immediate publish status: $REVIEW_PUBLISH"; exit 1)
          php wp-cli.phar eval --path=/tmp/mojarrad-test '
            $p=get_page_by_path("sakhtan-ya-sabr",OBJECT,"post");
            if(!$p || $p->post_status!=="publish" || !get_post_meta($p->ID,"_moj_editorial_approved_hash",true)) throw new RuntimeException("Approved article not published.");
          '
          curl -fsS "http://127.0.0.1:8081/wp-json/wp/v2/posts/$ARTICLE_ID" > /tmp/moj-published-article.json
          echo "Reviewer password login, private preview, denied member access, schedule and immediate publication PASSED"
          curl -fsS -c /tmp/moj-contractor-cookie http://127.0.0.1:8081/wp-login.php > /dev/null
          curl -sS -L -b /tmp/moj-contractor-cookie -c /tmp/moj-contractor-cookie \
            --data-urlencode 'log=moj_demo_contractor' \
            --data-urlencode 'pwd=ci-contractor-password-only' \
            --data-urlencode 'wp-submit=Log In' \
            --data-urlencode 'testcookie=1' \
            http://127.0.0.1:8081/wp-login.php > /tmp/contractor-login.html
          curl -fsS -b /tmp/moj-contractor-cookie http://127.0.0.1:8081/dashboard/ > /tmp/contractor-dashboard.html
          grep -q 'ویلای دوبلکس دهم شریع' /tmp/contractor-dashboard.html
          if grep -q 'ویلای مسکونی طرقبه انجیری' /tmp/contractor-dashboard.html; then
            echo "Data leak: contractor saw owner project"; exit 1
          fi
          curl -fsS http://127.0.0.1:8081/consulting/ > /tmp/consulting.html
          NONCE=$(grep -o 'name="moj_nonce" value="[^"]*"' /tmp/consulting.html | head -1 | sed -E 's/^.*value="([^"]*)"/\1/')
          test -n "$NONCE"
          FORM_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            --data-urlencode 'action=mojarrad_lead' \
            --data-urlencode 'moj_type=consulting' \
            --data-urlencode "moj_nonce=$NONCE" \
            --data-urlencode 'moj_name=CI Test Contact' \
            --data-urlencode 'moj_phone=09123456789' \
            --data-urlencode 'moj_message=Temporary test' \
            http://127.0.0.1:8081/wp-admin/admin-post.php)
          test "$FORM_CODE" = "303" || (echo "Lead post HTTP status: $FORM_CODE"; exit 1)
          php wp-cli.phar eval --path=/tmp/mojarrad-test '
            $items=get_posts(array("post_type"=>"moj_lead","post_status"=>"private","numberposts"=>-1));
            if(count($items)<1) throw new RuntimeException("Contact form was not stored");
            echo "HTTP forms + login + project isolation verified\n";
          '
          # Exercise actual private image upload and moderation via logged-in HTTP REST.
          set -x
          PID=$(php wp-cli.phar eval --path=/tmp/mojarrad-test '
            $p=get_page_by_path("torghabe-anjiri-1",OBJECT,"moj_project");
            echo (int)$p->ID;
          ')
          REPORT_ID=$(php wp-cli.phar eval --path=/tmp/mojarrad-test '
            global $wpdb;
            $t=$wpdb->prefix."moj_timeline_event";
            echo (int)$wpdb->get_var($wpdb->prepare("SELECT id FROM {$t} WHERE title=%s LIMIT 1","گزارش رسمی پیشرفت (نمونه)"));
          ')
          test "$PID" -gt 0
          test "$REPORT_ID" -gt 0
          curl -fsS -b /tmp/moj-owner-cookie "http://127.0.0.1:8081/timeline/?project=$PID" >/tmp/moj-owner-timeline.html
          OWNER_NONCE=$(python3 -c 'import json,re; s=open("/tmp/moj-owner-timeline.html").read(); m=re.search(r"window\.mojTimeline=(\{[^;]+\});",s); assert m,"REST nonce missing"; print(json.loads(m.group(1))["nonce"])')
          curl -fsS -b /tmp/moj-owner-cookie -H "X-WP-Nonce: $OWNER_NONCE" \
            "http://127.0.0.1:8081/wp-json/mojarrad/v1/projects/$PID/timeline" > /tmp/timeline-owner.json
          python3 -c 'import json,sys; d=json.load(open("/tmp/timeline-owner.json")); assert d["events"] and all(e["isReport"] for e in d["events"]),"Owner data leak"'
          php -r '$im=imagecreatetruecolor(4,4);imagefill($im,0,0,imagecolorallocate($im,52,112,178));imagepng($im,"/tmp/moj-test-evidence.png");imagedestroy($im);'
          curl -fsS -b /tmp/moj-owner-cookie -H "X-WP-Nonce: $OWNER_NONCE" \
            -F "file=@/tmp/moj-test-evidence.png;type=image/png" \
            "http://127.0.0.1:8081/wp-json/mojarrad/v1/timeline/$REPORT_ID/media" > /tmp/moj-media-upload.json
          python3 -c 'import json; d=json.load(open("/tmp/moj-media-upload.json")); assert d["media"]["status"]=="pending"'
          MEDIA_ID=$(python3 -c 'import json; print(json.load(open("/tmp/moj-media-upload.json"))["media"]["id"])')
          MEDIA_URL=$(python3 -c 'import json; print(json.load(open("/tmp/moj-media-upload.json"))["media"]["url"])')
          OWNER_MEDIA_CODE=$(curl -sS -o /tmp/moj-secure-download.png -w '%{http_code}' -b /tmp/moj-owner-cookie "$MEDIA_URL")
          test "$OWNER_MEDIA_CODE" = "200"
          cmp /tmp/moj-test-evidence.png /tmp/moj-secure-download.png
          PUBLIC_MEDIA_CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$MEDIA_URL")
          test "$PUBLIC_MEDIA_CODE" != "200"
          curl -fsS -c /tmp/moj-admin-cookie http://127.0.0.1:8081/wp-login.php >/dev/null
          curl -sS -L -b /tmp/moj-admin-cookie -c /tmp/moj-admin-cookie \
            --data-urlencode 'log=siteadmin' --data-urlencode 'pwd=temporary-local-ci-only' \
            --data-urlencode 'wp-submit=Log In' --data-urlencode 'testcookie=1' \
            http://127.0.0.1:8081/wp-login.php >/dev/null
          curl -fsS -b /tmp/moj-admin-cookie "http://127.0.0.1:8081/timeline/?project=$PID" >/tmp/moj-admin-timeline.html
          ADMIN_NONCE=$(python3 -c 'import json,re; s=open("/tmp/moj-admin-timeline.html").read(); m=re.search(r"window\.mojTimeline=(\{[^;]+\});",s); assert m,"Admin REST nonce missing"; print(json.loads(m.group(1))["nonce"])')
          curl -fsS -X PATCH -b /tmp/moj-admin-cookie -H "X-WP-Nonce: $ADMIN_NONCE" \
            -H 'Content-Type: application/json' -d '{"status":"approved"}' \
            "http://127.0.0.1:8081/wp-json/mojarrad/v1/media/$MEDIA_ID/moderate" >/tmp/moj-media-approved.json
          python3 -c 'import json; d=json.load(open("/tmp/moj-media-approved.json")); assert d["media"]["status"]=="approved"'
          echo "Real private upload, authenticated download and media moderation PASSED"

          # Real project-office evidence upload, owner-only access, and verified archive download.
          curl -fsS -b /tmp/moj-owner-cookie "http://127.0.0.1:8081/office/?project=$PID&section=references" > /tmp/moj-owner-office.html
          OFFICE_NONCE=$(python3 -c 'import json,re; s=open("/tmp/moj-owner-office.html").read(); m=re.search(r"window\.mojOffice=(\{[^;]+\});",s); assert m,"Office REST nonce missing"; print(json.loads(m.group(1))["nonce"])')
          REF_ID=$(php wp-cli.phar eval --path=/tmp/mojarrad-test '
            global $wpdb;$t=$wpdb->prefix."moj_office_record";
            echo (int)$wpdb->get_var($wpdb->prepare("SELECT id FROM {$t} WHERE project_id=%d AND section=%s AND title=%s LIMIT 1",get_page_by_path("torghabe-anjiri-1",OBJECT,"moj_project")->ID,"references","بازنگری نمای اصلی"));
          ')
          test "$REF_ID" -gt 0
          curl -fsS -b /tmp/moj-owner-cookie -H "X-WP-Nonce: $OFFICE_NONCE" \
            -F "file=@/tmp/moj-test-evidence.png;type=image/png" \
            "http://127.0.0.1:8081/wp-json/mojarrad/v1/office/record/$REF_ID/file" > /tmp/moj-office-file.json
          OFFICE_MEDIA_URL=$(python3 -c 'import json; d=json.load(open("/tmp/moj-office-file.json")); assert d["item"]["file"]["mime"]=="image/png"; print(d["item"]["file"]["url"])')
          OFF_CODE=$(curl -sS -o /tmp/moj-office-download.png -w '%{http_code}' \
            -b /tmp/moj-owner-cookie "$OFFICE_MEDIA_URL")
          test "$OFF_CODE" = "200"
          cmp /tmp/moj-test-evidence.png /tmp/moj-office-download.png
          ANON_OFF_CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$OFFICE_MEDIA_URL")
          test "$ANON_OFF_CODE" != "200"
          CONTRACT_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/moj-owner-cookie -H "X-WP-Nonce: $OFFICE_NONCE" \
            "http://127.0.0.1:8081/wp-json/mojarrad/v1/projects/$PID/office/contracts")
          test "$CONTRACT_CODE" = "403"
          curl -fsS -b /tmp/moj-admin-cookie -H "X-WP-Nonce: $ADMIN_NONCE" \
            "http://127.0.0.1:8081/wp-json/mojarrad/v1/projects/$PID/archives" > /tmp/moj-project-archives.json
          ARCHIVE_URL=$(python3 -c 'import json; d=json.load(open("/tmp/moj-project-archives.json")); assert d["items"];print(d["items"][0]["url"])')
          curl -fsS -b /tmp/moj-admin-cookie "$ARCHIVE_URL" > /tmp/moj-project-archive.zip
          unzip -tq /tmp/moj-project-archive.zip
          PUBLIC_ARCHIVE_CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$ARCHIVE_URL")
          test "$PUBLIC_ARCHIVE_CODE" != "200"
          echo "Project office evidence download, private roles and verified archive HTTP checks PASSED"

          npm install --no-package-lock --no-save --prefix wordpress/tools/mobile playwright@1.56.1
          wordpress/tools/mobile/node_modules/.bin/playwright install --with-deps chromium
          node wordpress/tools/mobile/check.mjs

      - name: Save viewport screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-responsive-screenshots
          path: /tmp/mojarrad-mobile-captures
          if-no-files-found: ignore
          retention-days: 7
